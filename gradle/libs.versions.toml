#
# Version Catalog centralizado — Manual de Arquitectura, sección 5.4.
# Toda versión de dependencia se declara aquí. Prohibido declarar versiones
# directamente en build.gradle.kts de módulos (ver TRACEABILITY.md > gradle).
#
# Versiones confirmadas por sincronización real en Android Studio.
#
[versions]
junit = "4.13.2"
junitVintageEngine = "6.1.3"
kotlin = "2.4.21"
agp = "9.5.0"
coroutines = "1.11.0"
hilt = "2.60.1"
detekt = "1.23.8"
junit5 = "6.1.3"
mockk = "1.14.11"
kotlinxImmutableCollections = "0.5.2"
javaxInject = "1"
ksp = "2.3.11" # versión de KSP para este release — SIN prefijo de Kotlin (corregido; revierte una indicación previa incorrecta)
baselineprofile = "1.5.0" # actualizado tras confirmación de incompatibilidad con el DSL de dispositivos de AGP 9.4.0
hiltComposeIntegration = "1.4.0" # reutilizada también por hilt-work y androidx-hilt-compiler — confirmado por sincronización real
activityCompose = "1.13.0"
biometric = "1.2.0-alpha05"
datastorePreferences = "1.3.0"
integrity = "1.6.0"
navigationCompose = "2.10.2"
profileinstaller = "1.4.1"
robolectricVersion = "4.17"
timber = "5.0.1"
tinkAndroid = "1.24.0"
work = "2.12.0"
androidxTestExtJunit = "1.3.0"
espresso = "3.7.0"
benchmarkMacro = "1.5.0"
uiautomator = "2.4.0"
room = "2.8.5"
retrofit = "3.0.0"
okhttp = "5.5.1"
webkit = "1.18.0"
kover = "0.9.11"
credentials = "1.6.0"
googleid = "1.2.1"
lifecycle = "2.11.0"
workTesting = "2.12.0"
androidxTestCore = "1.7.0"
robolectric = "4.17"

[libraries]
# Plugin markers, usados únicamente desde build-logic/convention/build.gradle.kts
detekt-api = { module = "io.gitlab.arturbosch.detekt:detekt-api", version.ref = "detekt" }
detekt-test = { module = "io.gitlab.arturbosch.detekt:detekt-test", version.ref = "detekt" }
junit = { module = "junit:junit", version.ref = "junit" }
junit-vintage-engine = { module = "org.junit.vintage:junit-vintage-engine", version.ref = "junitVintageEngine" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
detekt-gradlePlugin = { module = "io.gitlab.arturbosch.detekt:detekt-gradle-plugin", version.ref = "detekt" }
hilt-gradlePlugin = { module = "com.google.dagger:hilt-android-gradle-plugin", version.ref = "hilt" }
ksp-gradlePlugin = { module = "com.google.devtools.ksp:symbol-processing-gradle-plugin", version.ref = "ksp" }

kotlin-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlin-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "kotlinxImmutableCollections" }
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
junit5-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit5" }
junitPlatformLauncher = { module = "org.junit.platform:junit-platform-launcher" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }

# :domain usa @Inject (javax.inject) en sus UseCases pero NO depende de Hilt
# directamente (Hilt requiere el plugin de Android; :domain es Kotlin puro,
# ver KotlinJvmConventionPlugin.kt). javax.inject es la única dependencia de
# anotaciones de inyección que :domain puede tener sin romper esa regla.
javax-inject = { module = "javax.inject:javax.inject", version.ref = "javaxInject" }

# Reemplaza a androidx.hilt:hilt-navigation-compose — hiltViewModel() se
# movió de paquete (androidx.hilt.lifecycle.viewmodel.compose). Confirmado
# por sincronización real: advertencia de obsolescencia resuelta al migrar.
hilt-lifecycle-viewmodel-compose = { module = "androidx.hilt:hilt-lifecycle-viewmodel-compose", version.ref = "hiltComposeIntegration" }
hilt-work = { module = "androidx.hilt:hilt-work", version.ref = "hiltComposeIntegration" }
androidx-hilt-compiler = { module = "androidx.hilt:hilt-compiler", version.ref = "hiltComposeIntegration" }

androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "biometric" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastorePreferences" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileinstaller" }
androidx-material3 = { module = "androidx.compose.material3:material3" } # sin versión propia: resuelta por el Compose BOM
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
integrity = { module = "com.google.android.play:integrity", version.ref = "integrity" }
robolectric-v417 = { module = "org.robolectric:robolectric", version.ref = "robolectricVersion" }
timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }
tink-android = { module = "com.google.crypto.tink:tink-android", version.ref = "tinkAndroid" }
work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }

androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
androidx-benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "benchmarkMacro" }
androidx-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-converter-kotlinx-serialization = { module = "com.squareup.retrofit2:converter-kotlinx-serialization", version.ref = "retrofit" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging-interceptor = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
androidx-credentials = { module = "androidx.credentials:credentials", version.ref = "credentials" }
androidx-credentials-play-services-auth = { module = "androidx.credentials:credentials-play-services-auth", version.ref = "credentials" }
googleid = { module = "com.google.android.libraries.identity.googleid:googleid", version.ref = "googleid" }
androidx-lifecycle-common = { module = "androidx.lifecycle:lifecycle-common", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
work-testing = { module = "androidx.work:work-testing", version.ref = "workTesting" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
baselineprofile = { id = "androidx.baselineprofile", version.ref = "baselineprofile" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }

# Referencia cruzada: TRACEABILITY.md > gradle
# Manual de Buenas Prácticas de Código, sección 5.4 (Gradle Version Catalogs)
